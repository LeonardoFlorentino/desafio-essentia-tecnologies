# Security headers for the pages and files served by nginx (included in each location below:
# an add_header inside a location replaces every add_header inherited from the server block).
# /api responses are not touched here: the API sends its own headers.

# Scripts and styles only from this site. 'unsafe-inline' for styles: Angular adds component
# styles as <style> elements at runtime. No inline script exists (critical CSS inlining is off
# in angular.json for this reason).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
