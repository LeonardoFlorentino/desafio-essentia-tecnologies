server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Do not reveal the nginx version in headers and error pages.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same origin for page and API: no CORS, and the SameSite=Strict session cookie just works.
    # ^~ makes this prefix win over the regex below, so the API's own .js/.css (Swagger UI at
    # /api/docs) are proxied instead of looked up on disk.
    location ^~ /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files carry a content hash in their names: they can be cached for good.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /login on reload) get index.html, never cached.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
