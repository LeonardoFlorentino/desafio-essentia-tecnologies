<section class="new-task" aria-labelledby="new-task-heading">
  <h2 id="new-task-heading">Nova tarefa</h2>

  <form class="task-form" [formGroup]="form" (ngSubmit)="addTask()" novalidate>
    <div class="field">
      <label for="new-task-title">Título</label>
      <input
        id="new-task-title"
        type="text"
        formControlName="title"
        maxlength="255"
        autocomplete="off"
        [attr.aria-invalid]="showError(form, 'title')"
        [attr.aria-describedby]="showError(form, 'title') ? 'new-task-title-error' : null"
      />
      @if (showError(form, 'title')) {
        <p id="new-task-title-error" class="field__error">Informe o título da tarefa.</p>
      }
    </div>

    <div class="field">
      <label for="new-task-description"
        >Descrição <span class="field__hint">(opcional)</span></label
      >
      <textarea
        id="new-task-description"
        formControlName="description"
        rows="2"
        maxlength="5000"
      ></textarea>
    </div>

    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Adicionando…' : 'Adicionar tarefa' }}
    </button>
  </form>
</section>

<section aria-labelledby="tasks-heading">
  <h2 id="tasks-heading" tabindex="-1">Tarefas</h2>

  <ul class="task-list">
    @for (task of tasks(); track task.id) {
      <li>
        <app-task-item
          [task]="task"
          [busy]="busyIds().has(task.id)"
          [editing]="editingId() === task.id"
          [locked]="editingId() !== null && editingId() !== task.id"
          (completedChange)="setCompleted(task, $event)"
          (editingChange)="setEditing(task, $event)"
          (save)="saveEdit(task, $event)"
          (remove)="deleteTask(task)"
        />
      </li>
    }
  </ul>
</section>
