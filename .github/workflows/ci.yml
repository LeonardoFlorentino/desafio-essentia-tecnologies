name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  # Same databases as docker-compose.yml, as service containers (see the jobs below).
  DB_HOST: 127.0.0.1
  DB_USER: todo
  DB_PASSWORD: todo
  DB_NAME: todo
  MONGO_URL: mongodb://todo:todo@127.0.0.1:27017/?authSource=admin
  JWT_SECRET: ci-only-secret-for-tests-0123456789abcdef

jobs:
  commits:
    name: Commit messages and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Every commit of the push (or of the pull request) must follow Conventional Commits.
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          fi
      # The pre-commit hook formats staged files; this also catches a commit made with --no-verify.
      - name: Check formatting (Prettier)
        run: npx prettier --check .

  backend:
    name: Backend (lint, build, audit, tests + coverage)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: todo_test
          MYSQL_USER: todo
          MYSQL_PASSWORD: todo
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utodo -ptodo --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: todo
          MONGO_INITDB_ROOT_PASSWORD: todo
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      # Unit + integration (todo_test in both databases); fails below the coverage thresholds.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend:
    name: Frontend (lint, build, audit, tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: todo_test
          MYSQL_USER: todo
          MYSQL_PASSWORD: todo
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utodo -ptodo --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: todo
          MONGO_INITDB_ROOT_PASSWORD: todo
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run test:e2e:install
      # CI=true (set by GitHub): fresh servers, 2 workers, 1 retry, HTML report.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same images that `docker compose up --build` runs (api and web).
      - run: docker compose build api web
