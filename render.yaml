# Render Blueprint: the public demo of the API (Render → New → Blueprint → this repository).
# The databases are outside Render: MySQL on Aiven and MongoDB on Atlas, both on free plans.
# Values marked `sync: false` are typed in the Render dashboard when the Blueprint is created;
# they never live in the repository.
services:
  - type: web
    name: techx-tasks-api
    runtime: docker
    plan: free
    # Closest Render region to Brazil.
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Ready = MySQL and MongoDB answer (until then Render keeps sending traffic to the old version).
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      # Generated once by Render and kept across deploys: sessions survive a new version.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # HTTPS on Render: the session cookie only travels over HTTPS (Secure).
      - key: COOKIE_SECURE
        value: 'true'
      # Measured in production, through the site: browser → Cloudflare (site) → Render's rewrite server
      # (74.220.48.0/20, Render per ARIN) → Cloudflare (API) → load balancer (10.x) → a proxy in the
      # container (::1) → API; called directly, fewer hops. Trust those networks rather than a count:
      # the client IP is the first address outside them, and a forged one is never reached. Cloudflare
      # ranges from cloudflare.com/ips (2026-10-23); if one changes, the limit is shared, never lifted.
      # The test in backend/tests/integration/rate-limit.test.ts reads this value.
      - key: TRUST_PROXY
        value: 'loopback, uniquelocal, 74.220.48.0/20, 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22, 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32'
      # Public demo with the evaluation account (demo@techx.com / demo12345, as in the README).
      - key: SEED_DEMO_USER
        value: 'true'
      - key: LOG_LEVEL
        value: info
      # Aiven MySQL (Overview → Connection information). DB_SSL_CA = the "CA certificate" there.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA
        sync: false
      # MongoDB Atlas: mongodb+srv://<user>:<password>@<cluster>/ — a user with readWrite on the
      # database below only (not an Atlas admin).
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB_NAME
        value: todo
      # Browser origin allowed to call the API directly. Empty: none — the site reaches the API
      # through its own /api rewrite (same origin), not cross-origin.
      - key: CORS_ORIGIN
        sync: false

  # The Angular app, as static files on Render's CDN, rebuilt on every push to the branch.
  - type: web
    name: techx-tasks
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '24'
    routes:
      # Same origin for page and API (as nginx does in Docker): Render serves the API's answer
      # at the site's own /api path, so the SameSite=Strict session cookie belongs to this site.
      - type: rewrite
        source: /api/*
        destination: https://techx-tasks-api.onrender.com/api/*
      # Single-page app: unknown paths (e.g. /login on reload) get index.html. Files that exist
      # (the hashed .js/.css) are served before any rule.
      - type: rewrite
        source: /*
        destination: /index.html
    # Same headers as frontend/security-headers.conf (nginx in Docker).
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
